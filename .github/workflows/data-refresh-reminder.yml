name: Annual data refresh reminder

on:
  schedule:
    - cron: "0 9 1 10 *"  # 9am UTC on Oct 1 every year
  workflow_dispatch:       # allow manual trigger to test

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "📅 Annual data refresh due — openskidata.org",
              labels: ["maintenance"],
              body: `## Ski resort data refresh
